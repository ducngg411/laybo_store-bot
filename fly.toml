# fly.toml app configuration file generated for laybo-store-bot
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'laybo-store-bot'
primary_region = 'sin'  # Singapore region (closest to Vietnam)

[build]

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[deploy]
  strategy = "immediate"
